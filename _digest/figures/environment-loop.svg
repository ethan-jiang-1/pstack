<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="从摩擦到环境改进的闭环">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" class="t h">环境也是交付物</text>
  <text x="480" y="64" text-anchor="middle" class="t s">一次纠正要么改变当前 diff，要么改变下一次运行的环境</text>

  <rect x="60" y="100" width="300" height="86" rx="10" fill="#fee2e2" stroke="#fecaca"/>
  <text x="78" y="128" class="t bt">摩擦 / 反复纠正</text>
  <text x="78" y="150" class="t bs">同类错误第二次出现</text>
  <text x="78" y="170" class="t bs">review、CI、用户反馈里的重复信号</text>

  <rect x="590" y="100" width="310" height="86" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="608" y="128" class="t bt">证据</text>
  <text x="608" y="150" class="t bs">transcript · 评审记录 · 事故</text>
  <text x="608" y="170" class="t bs">没有证据的改进会变成凭印象改文档</text>

  <rect x="590" y="330" width="310" height="86" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="608" y="358" class="t bt">分类：结构还是判断</text>
  <text x="608" y="380" class="t bs">能由 lint / 类型 / 测试 / 元数据约束的</text>
  <text x="608" y="400" class="t bs">不要用更多文字解决</text>

  <rect x="60" y="330" width="300" height="86" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="78" y="358" class="t bt">结构约束 + 下一次运行</text>
  <text x="78" y="380" class="t bs">架构 → 类型 → lint → 测试 → 文档</text>
  <text x="78" y="400" class="t bs">每条检查要在真实历史错误上会失败</text>

  <line x1="360" y1="143" x2="590" y2="143" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745" y1="186" x2="745" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="373" x2="360" y2="373" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="330" x2="210" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="286" class="t s">下一次运行起步更好</text>

  <rect x="330" y="216" width="290" height="104" rx="12" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="475" y="242" text-anchor="middle" class="t bt">reflect 的三条出口</text>
  <text x="475" y="264" text-anchor="middle" class="t bs">Accepted / Rejected / Backlog</text>
  <text x="475" y="286" text-anchor="middle" class="t bs">Accepted 要人批准后才改 skill</text>
  <text x="475" y="306" text-anchor="middle" class="t bs">能结构化的项移到 Backlog</text>

  <text x="480" y="470" text-anchor="middle" class="t s">correct：把 operator 的反复纠正变成仓库检查；每条检查都要证明它在一次真实错误上会失败</text>
  <text x="480" y="494" text-anchor="middle" class="t s">automate-me：把个人工作约定固化成 -mode skill；create-verification-skill：把真实驱动固化成控制面</text>
  <text x="480" y="524" text-anchor="middle" class="t s">风险：自修改会污染未来每个 agent；改动范围越大，批准门越重要</text>
</svg>
