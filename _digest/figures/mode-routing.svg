<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="请求如何经过 mode 进入 playbook">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 12px; fill: #475569; }
      .side { font-size: 12px; fill: #7c3aed; }
    </style>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" class="t h">一次 mode 运行</text>
  <text x="480" y="64" text-anchor="middle" class="t s">选择与执行不换手：选完 playbook，步骤立刻变成 todo</text>

  <rect x="330" y="86" width="300" height="46" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="480" y="114" text-anchor="middle" class="t bt">一句请求</text>

  <rect x="330" y="152" width="300" height="52" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="480" y="174" text-anchor="middle" class="t bt">poteto-mode</text>
  <text x="480" y="194" text-anchor="middle" class="t bs">读请求，匹配 23 个 playbook 之一</text>

  <rect x="330" y="224" width="300" height="52" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="480" y="246" text-anchor="middle" class="t bt">playbook 文件</text>
  <text x="480" y="266" text-anchor="middle" class="t bs">步骤 · 门 · 失败出口 · Reply</text>

  <rect x="330" y="296" width="300" height="52" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="480" y="318" text-anchor="middle" class="t bt">todo list</text>
  <text x="480" y="338" text-anchor="middle" class="t bs">步骤逐字复制 · 跳过留 skip: 原因</text>

  <rect x="330" y="368" width="300" height="52" rx="10" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="480" y="390" text-anchor="middle" class="t bt">执行</text>
  <text x="480" y="410" text-anchor="middle" class="t bs">按步骤调用 skill / 派 subagent</text>

  <rect x="330" y="440" width="300" height="52" rx="10" fill="#fee2e2" stroke="#fecaca"/>
  <text x="480" y="462" text-anchor="middle" class="t bt">证据</text>
  <text x="480" y="482" text-anchor="middle" class="t bs">真实表面 · 独立 verdict · 测量方法</text>

  <rect x="330" y="512" width="300" height="52" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="480" y="534" text-anchor="middle" class="t bt">回复 / PR / 轨迹</text>
  <text x="480" y="554" text-anchor="middle" class="t bs">unslop · technical-writing · show-me-your-work</text>

  <line x1="480" y1="132" x2="480" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="204" x2="480" y2="224" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="276" x2="480" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="348" x2="480" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="420" x2="480" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="492" x2="480" y2="512" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- side annotations -->
  <rect x="680" y="152" width="220" height="70" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="696" y="176" class="t side">没有窄 playbook 能覆盖？</text>
  <text x="696" y="196" class="t bs">→ figure-it-out</text>
  <text x="696" y="212" class="t bs">→ Orchestrate（持续 program）</text>

  <rect x="60" y="296" width="220" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="320" class="t bs">todo 是最便宜的状态机</text>
  <text x="76" y="340" class="t bs">跳过与遗忘因此可区分</text>

  <rect x="60" y="368" width="220" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="392" class="t bs">每个 spawn 按角色选模型</text>
  <text x="76" y="412" class="t bs">验证者不是实现者</text>

  <rect x="680" y="440" width="220" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="696" y="464" class="t bs">"测试绿了" 不是完成</text>
  <text x="696" y="484" class="t bs">见验证与 verdict</text>
</svg>
