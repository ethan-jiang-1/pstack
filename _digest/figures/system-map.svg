<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="pstack 的六层结构">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 12px; fill: #475569; }
      .lab { font-size: 12px; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" class="t h">pstack 的六层结构</text>
  <text x="480" y="66" text-anchor="middle" class="t s">每层解决不同问题：装上了不等于会路由，会路由不等于有证据</text>

  <!-- 分发 -->
  <rect x="210" y="92" width="520" height="56" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="232" y="116" class="t bt">分发</text>
  <text x="232" y="136" class="t bs">插件 / skills CLI / 手拷目录 · poteto-mode 依赖大多数 skill</text>
  <text x="190" y="125" text-anchor="end" class="t lab">环境</text>

  <!-- 路由 -->
  <rect x="210" y="166" width="520" height="56" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="232" y="190" class="t bt">路由</text>
  <text x="232" y="210" class="t bs">poteto-mode 匹配 23 个 playbook · poteto-help 只答疑不开工</text>
  <text x="190" y="199" text-anchor="end" class="t lab">入口</text>

  <!-- 流程 -->
  <rect x="210" y="240" width="520" height="56" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="232" y="264" class="t bt">流程</text>
  <text x="232" y="284" class="t bs">步骤 · 门 · 失败出口 · 共享收尾 · Reply 形状</text>
  <text x="190" y="273" text-anchor="end" class="t lab">协议</text>

  <!-- 词汇 -->
  <rect x="210" y="314" width="520" height="56" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="232" y="338" class="t bt">词汇</text>
  <text x="232" y="358" class="t bs">24 条 principle · how / why / teach · unslop / technical-writing</text>
  <text x="190" y="347" text-anchor="end" class="t lab">判断</text>

  <!-- 委派 -->
  <rect x="210" y="388" width="520" height="56" rx="10" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="232" y="412" class="t bt">委派</text>
  <text x="232" y="432" class="t bs">subagent · 角色到模型的面板 · swarm / arena / interrogate</text>
  <text x="190" y="421" text-anchor="end" class="t lab">并行</text>

  <!-- 证据 -->
  <rect x="210" y="462" width="520" height="56" rx="10" fill="#fee2e2" stroke="#fecaca"/>
  <text x="232" y="486" class="t bt">证据</text>
  <text x="232" y="506" class="t bs">真实表面 · 独立 verdict · benchmark · 决策轨迹</text>
  <text x="190" y="495" text-anchor="end" class="t lab">收口</text>

  <!-- arrows -->
  <line x1="470" y1="148" x2="470" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="222" x2="470" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="296" x2="470" y2="314" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="370" x2="470" y2="388" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="444" x2="470" y2="462" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- autonomy rail -->
  <rect x="770" y="240" width="160" height="278" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="850" y="270" text-anchor="middle" class="t bt">自主</text>
  <text x="790" y="298" class="t bs">横切流程、委派、证据</text>
  <text x="790" y="322" class="t bs">可逆的事直接做</text>
  <text x="790" y="346" class="t bs">不可逆的必须停</text>
  <text x="790" y="370" class="t bs">授权改变问不问</text>
  <text x="790" y="394" class="t bs">不改变算不算完成</text>
  <line x1="730" y1="380" x2="770" y2="380" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="480" y="556" text-anchor="middle" class="t s">源码事实源：skills/**/SKILL.md · 解读层只解释结构与理由</text>
  <text x="480" y="580" text-anchor="middle" class="t s">历史变化：_change_log/ · 决策问题：_faq_on_digest/ · 独立方法：_handbook_for_agent_engineering/</text>
</svg>
