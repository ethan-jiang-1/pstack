<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="部署、暴露与交付，以及观察回路">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">交付不是合入</text>
  <text x="480" y="62" text-anchor="middle" class="t s">部署、暴露、交付是三个决定；观察与回退要在暴露之前写好</text>

  <rect x="50" y="110" width="250" height="110" rx="12" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="70" y="138" class="t bt">部署</text>
  <text x="70" y="162" class="t bs">把固定版本放进环境</text>
  <text x="70" y="184" class="t bs">代码在，开关可以关着</text>
  <text x="70" y="206" class="t s">不等于任何用户能用</text>

  <rect x="350" y="110" width="250" height="110" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="370" y="138" class="t bt">暴露</text>
  <text x="370" y="162" class="t bs">允许具体用户或系统触发</text>
  <text x="370" y="184" class="t bs">内部 12 人 / 百分比 / 单租户</text>
  <text x="370" y="206" class="t s">小边界让失败成本可控</text>

  <rect x="660" y="110" width="260" height="110" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="680" y="138" class="t bt">交付</text>
  <text x="680" y="162" class="t bs">具名人基于证据与风险批准</text>
  <text x="680" y="184" class="t bs">版本 + 范围 + 观察 + 回退</text>
  <text x="680" y="206" class="t s">可以被限制、等待或不交付</text>

  <line x1="300" y1="165" x2="350" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="165" x2="660" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="280" width="400" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="70" y="308" class="t bt">观察</text>
  <text x="70" y="334" class="t bs">2-4 个信号；记录基线</text>
  <text x="70" y="358" class="t bs">错误率、p95 耗时、missing 数、反馈</text>
  <text x="70" y="382" class="t bs">事实与原因假设分开写</text>
  <text x="70" y="406" class="t bs">按判据决定：继续 / 关闭 / 回滚</text>
  <text x="70" y="434" class="t s">没有信号的交付，只能靠用户投诉发现问题。</text>

  <rect x="510" y="280" width="410" height="180" rx="12" fill="#fee2e2" stroke="#fecaca"/>
  <text x="530" y="308" class="t bt">回退与下一轮入口</text>
  <text x="530" y="334" class="t bs">回退：关 flag / 回滚版本 / 停暴露</text>
  <text x="530" y="358" class="t bs">先止损，再分析原因</text>
  <text x="530" y="382" class="t bs">下一轮：修复 / 诊断 / 重新定义 / 补观察</text>
  <text x="530" y="406" class="t bs">不要所有信号都直接开修</text>
  <text x="530" y="434" class="t s">回退方案要在暴露之前写好。</text>

  <path d="M 810 220 C 810 250, 810 250, 810 280" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 250 280 C 250 250, 250 250, 250 220" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="480" y="500" text-anchor="middle" class="t s">交付决定卡：版本、目标、暴露范围、证据、风险、信号、回退、owner、重新打开条件。</text>
</svg>
