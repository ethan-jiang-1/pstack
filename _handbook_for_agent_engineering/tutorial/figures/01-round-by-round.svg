<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="一次访谈的一轮">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 12px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">一次访谈的一轮</text>
  <text x="480" y="62" text-anchor="middle" class="t s">事实由 agent 查，决定由人作；复述被纠正之前不进入实现</text>

  <rect x="60" y="92" width="240" height="64" rx="10" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="78" y="118" class="t bt">只访谈，不动手</text>
  <text x="78" y="140" class="t bs">在"开始"之前不改代码</text>

  <rect x="380" y="92" width="300" height="64" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="398" y="118" class="t bt">2. 当前 当前可问的问题 的问题</text>
  <text x="398" y="140" class="t bs">只问会改变接下来做什么的问题</text>

  <rect x="380" y="186" width="300" height="64" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="398" y="212" class="t bt">3. 每个问题带推荐答案</text>
  <text x="398" y="234" class="t bs">给一个可以同意的起点，不是替你决定</text>

  <rect x="380" y="280" width="300" height="64" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="398" y="306" class="t bt">4. 人只回答决定</text>
  <text x="398" y="328" class="t bs">"按推荐"，或说出为什么选备选</text>

  <rect x="380" y="374" width="300" height="64" rx="10" fill="#fee2e2" stroke="#fecaca"/>
  <text x="398" y="400" class="t bt">5. agent 用自己的话复述</text>
  <text x="398" y="422" class="t bs">目标、非目标、约束、未知、下一步</text>

  <rect x="720" y="92" width="200" height="158" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="738" y="118" class="t bt">分工</text>
  <text x="738" y="144" class="t bs">事实：仓库、配置、</text>
  <text x="738" y="164" class="t bs">现有测试 → agent 查</text>
  <text x="738" y="194" class="t bs">决定：产品、范围、</text>
  <text x="738" y="214" class="t bs">优先级 → 人回答</text>

  <rect x="720" y="374" width="200" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="738" y="400" class="t bt">纠正</text>
  <text x="738" y="424" class="t bs">指出哪一句不对</text>
  <text x="738" y="444" class="t bs">再复述一次</text>
  <text x="738" y="464" class="t bs">直到你不需要改</text>

  <line x1="300" y1="124" x2="380" y2="124" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="156" x2="530" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="250" x2="530" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="344" x2="530" y2="374" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="406" x2="720" y2="424" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="486" width="480" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="480" y="514" text-anchor="middle" class="t bt">复述通过之后，才说"开始"</text>

  <line x1="530" y1="438" x2="530" y2="486" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="120" y="300" class="t s">一轮问完 当前可问的问题，</text>
  <text x="120" y="320" class="t s">不要一次只问一个。</text>
  <text x="120" y="352" class="t s">答完这一批，</text>
  <text x="120" y="372" class="t s">下一批才会解锁。</text>
</svg>
