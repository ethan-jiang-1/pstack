<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="从原始请求到共同问题">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 12px; fill: #475569; }
      .q { font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" class="t h">从请求到共同问题</text>
  <text x="480" y="64" text-anchor="middle" class="t s">原始请求只说了"要什么"的一半，缺的部分会被默认值填满</text>

  <rect x="40" y="110" width="260" height="150" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="58" y="138" class="t bt">原始请求</text>
  <text x="58" y="164" class="t q">"给导出功能加个筛选，</text>
  <text x="58" y="184" class="t q">只导出我选中的行。"</text>
  <text x="58" y="218" class="t s">谁、何时、不能变什么、</text>
  <text x="58" y="236" class="t s">怎样算完成，都没有出现。</text>

  <rect x="350" y="96" width="250" height="180" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="370" y="124" class="t bt">四个缺口</text>
  <text x="370" y="150" class="t bs">1. 谁，在什么时刻用</text>
  <text x="370" y="176" class="t bs">2. 什么行为要改变</text>
  <text x="370" y="202" class="t bs">3. 什么明确不能变</text>
  <text x="370" y="228" class="t bs">4. 怎样算完成</text>
  <text x="370" y="258" class="t s">补不出的格子写成"未知"</text>

  <rect x="650" y="96" width="270" height="180" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="670" y="124" class="t bt">共同问题卡</text>
  <text x="670" y="150" class="t bs">谁/何时：早会前，运营发给财务</text>
  <text x="670" y="176" class="t bs">行为：勾选后只导出勾选行</text>
  <text x="670" y="202" class="t bs">不能变：列顺序、编码、全量入口</text>
  <text x="670" y="228" class="t bs">完成：12 行勾 3 行，文件恰好 3 行</text>
  <text x="670" y="258" class="t s">另外留下一列未知项</text>

  <line x1="300" y1="185" x2="350" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="185" x2="650" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="320" width="570" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="370" y="346" class="t bt">先不写代码</text>
  <text x="370" y="368" class="t bs">把未知项留到下一页的访谈里，让 agent 问你，而不是替你猜。</text>

  <line x1="485" y1="276" x2="485" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="785" y1="276" x2="785" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="436" text-anchor="middle" class="t s">这张卡不是 spec；它只保证你和 agent 讨论的是同一个问题。</text>
  <text x="480" y="460" text-anchor="middle" class="t s">下一页：一次访谈，一轮问完当前没有被阻塞的问题。</text>
</svg>
