<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="接口、切口与被隐藏的实现">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">模块形状</text>
  <text x="480" y="62" text-anchor="middle" class="t s">接口表达意图与结果，切口是调用者和测试共同观察的位置，实现藏在后面</text>

  <rect x="40" y="120" width="180" height="80" rx="10" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="58" y="148" class="t bt">调用方</text>
  <text x="58" y="170" class="t bs">页面、CLI、其他模块</text>
  <text x="58" y="190" class="t bs">只依赖接口</text>

  <rect x="40" y="270" width="180" height="80" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="58" y="298" class="t bt">测试</text>
  <text x="58" y="320" class="t bs">从同一切口进入</text>
  <text x="58" y="340" class="t bs">只断言可观察结果</text>

  <line x1="330" y1="90" x2="330" y2="420" stroke="#0f172a" stroke-width="3"/>
  <rect x="260" y="90" width="140" height="30" rx="6" fill="#0f172a"/>
  <text x="330" y="110" text-anchor="middle" class="t bs" fill="#ffffff">切口（seam）</text>

  <rect x="380" y="120" width="540" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="150" class="t bt">接口</text>
  <text x="400" y="176" class="mono">export(selection: ExportSelection): Promise&lt;ExportResult&gt;</text>
  <text x="400" y="202" class="t bs">调用者需要知道：意图、可观察结果、不变量、失败方式</text>

  <rect x="400" y="224" width="500" height="176" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="420" y="250" class="t bt">被隐藏的实现</text>
  <text x="420" y="276" class="t bs">订单读取：数据库、API、缓存</text>
  <text x="420" y="300" class="t bs">CSV 生成：转义、换行、列顺序</text>
  <text x="420" y="324" class="t bs">缺失检测：请求了但不存在的 id</text>
  <text x="420" y="348" class="t bs">文件写出：内存或流式</text>
  <text x="420" y="382" class="t s">改变这些，不应要求调用方或测试修改。</text>

  <line x1="220" y1="160" x2="260" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="310" x2="260" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="160" x2="380" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="310" x2="380" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="450" width="800" height="70" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="100" y="476" class="t bt">不变量</text>
  <text x="100" y="498" class="t bs">列顺序固定；rows 不含表头；missing 顺序与请求一致；空选择不由模块解释成全量。</text>
  <text x="100" y="514" class="t s">不变量与具体输入无关，是模块永远保证的事。</text>

  <text x="480" y="546" text-anchor="middle" class="t s">只有一个实现时不要加抽象；等第二个真实变化出现再抽。</text>
</svg>
