<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="委派的控制面">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">委派不是丢出去，也不是写死步骤</text>
  <text x="480" y="62" text-anchor="middle" class="t s">brief 定义目标、边界和验收；控制面保留在你的手里</text>

  <rect x="40" y="120" width="230" height="220" rx="12" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="60" y="148" class="t bt">你 / 控制面</text>
  <text x="60" y="178" class="t bs">你的 todo：在哪个包</text>
  <text x="60" y="202" class="t bs">你的 diff 复核</text>
  <text x="60" y="226" class="t bs">你的验收结论</text>
  <text x="60" y="262" class="t s">只覆盖"是否兑现"，</text>
  <text x="60" y="282" class="t s">不覆盖"用什么写法"。</text>
  <text x="60" y="312" class="t s">不接受执行者的转述</text>
  <text x="60" y="332" class="t s">作为完成证据。</text>

  <rect x="330" y="104" width="300" height="252" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="350" y="132" class="t bt">brief</text>
  <text x="350" y="158" class="t bs">目标：一句话，什么会不同</text>
  <text x="350" y="182" class="t bs">范围：可写 / 不可写</text>
  <text x="350" y="206" class="t bs">输入：权威产物的指针</text>
  <text x="350" y="230" class="t bs">验收：能运行的检查</text>
  <text x="350" y="254" class="t bs">禁止：不能改的入口与依赖</text>
  <text x="350" y="278" class="t bs">报告：改动、证据、未决项</text>
  <text x="350" y="302" class="t bs">时限：到点返回部分结果</text>
  <text x="350" y="326" class="t bs">上下文：执行者看不到的那一段</text>

  <rect x="690" y="120" width="230" height="150" rx="12" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="710" y="148" class="t bt">执行者</text>
  <text x="710" y="174" class="t bs">独立完成一个包</text>
  <text x="710" y="198" class="t bs">事实自己查</text>
  <text x="710" y="222" class="t bs">决定不越权</text>
  <text x="710" y="248" class="t s">默认新上下文；</text>
  <text x="710" y="268" class="t s">只有状态搬不走时才续用。</text>

  <rect x="690" y="310" width="230" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="710" y="338" class="t bt">报告</text>
  <text x="710" y="362" class="t bs">改了哪些文件</text>
  <text x="710" y="384" class="t bs">跑了什么命令、结果如何</text>
  <text x="710" y="406" class="t bs">还有什么没覆盖</text>

  <line x1="270" y1="200" x2="330" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="200" x2="690" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="805" y1="270" x2="805" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="430" x2="270" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>

  <rect x="180" y="466" width="600" height="54" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="480" y="490" text-anchor="middle" class="t bt">收到报告后：自己跑验收命令、读 diff、走一条真实路径</text>
  <text x="480" y="510" text-anchor="middle" class="t s">三者不一致时，以你实际看到的为准。</text>
</svg>
