<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="双轴评审">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
      .lab { font-size: 11px; font-weight: 700; fill: #92400e; }
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">双轴评审</text>
  <text x="480" y="62" text-anchor="middle" class="t s">同一段固定 diff，两条独立轴，一个明确决定；不合并成一个分数</text>

  <rect x="330" y="88" width="300" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="480" y="114" text-anchor="middle" class="t bt">固定范围：base → head</text>
  <text x="480" y="134" text-anchor="middle" class="t bs">三点 diff · 提交列表 · 评审包</text>

  <rect x="40" y="180" width="390" height="210" rx="12" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="60" y="208" class="t bt">标准轴</text>
  <text x="60" y="230" class="t bs">是否符合项目约定与可维护性？</text>
  <text x="60" y="258" class="t bs">命名、分层、错误处理</text>
  <text x="60" y="280" class="t bs">不必要的抽象、依赖、配置</text>
  <text x="60" y="302" class="t bs">测试是否在测行为</text>
  <text x="60" y="324" class="t bs">越界改动、顺手重构</text>
  <text x="60" y="352" class="t s">它能说"应该改"，但不能判断"承诺是否兑现"。</text>

  <rect x="530" y="180" width="390" height="210" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="550" y="208" class="t bt">规格轴</text>
  <text x="550" y="230" class="t bs">是否忠实实现来源承诺？</text>
  <text x="550" y="258" class="t bs">缺失：承诺了但没实现</text>
  <text x="550" y="280" class="t bs">额外：没承诺却加进来</text>
  <text x="550" y="302" class="t bs">错误：与词卡、行为卡不一致</text>
  <text x="550" y="324" class="t bs">依据：共同问题、行为卡、证据表</text>
  <text x="550" y="352" class="t s">一个完全符合约定的 PR，仍可能实现错了行为。</text>

  <line x1="420" y1="148" x2="300" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="148" x2="660" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="420" width="600" height="78" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="200" y="446" class="t bt">决定：合入 / 请求修改 / 再讨论</text>
  <text x="200" y="468" class="t bs">阻塞：缺失、安全、数据风险、越界</text>
  <text x="200" y="488" class="t bs">后续：命名、重复、可选优化；每条有 owner</text>

  <line x1="235" y1="390" x2="360" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="725" y1="390" x2="600" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="524" text-anchor="middle" class="t s">"总体 8 分"会掩盖冲突：标准满分、规格缺失的 PR 不该合入。</text>
</svg>
