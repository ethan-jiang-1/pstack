<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="工作包、阻塞边与当前 ready work">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">Work package 与 ready work</text>
  <text x="480" y="62" text-anchor="middle" class="t s">按"可独立验证"切；箭头是阻塞边；没有未完成前置的包才是当前 ready work</text>

  <rect x="70" y="120" width="240" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="90" y="148" class="t bt">P1 导出器核心 + 测试</text>
  <text x="90" y="172" class="t bs">勾选 3 个 id → 3 行 CSV</text>
  <text x="90" y="194" class="t bs">可写：exporter/ + 测试</text>
  <text x="90" y="216" class="t bs">验收：测试命令</text>
  <text x="90" y="234" class="t s">当前 ready work</text>

  <rect x="70" y="300" width="240" height="104" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="90" y="328" class="t bt">P4 全量导出回归</text>
  <text x="90" y="352" class="t bs">现有全量行为不变</text>
  <text x="90" y="374" class="t bs">可写：现有回归测试</text>
  <text x="90" y="394" class="t s">当前 ready work，可与 P1 并行</text>

  <rect x="600" y="100" width="280" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="620" y="128" class="t bt">P2 页面勾选与调用</text>
  <text x="620" y="152" class="t bs">勾选 3 行 → 下载 3 行文件</text>
  <text x="620" y="174" class="t bs">阻塞边：P1</text>
  <text x="620" y="194" class="t s">等 P1 定下接口</text>

  <rect x="600" y="240" width="280" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="620" y="268" class="t bt">P3 缺失行提示</text>
  <text x="620" y="292" class="t bs">删除 1 行 → missing 含该 id</text>
  <text x="620" y="314" class="t bs">阻塞边：P1</text>
  <text x="620" y="334" class="t s">等 P1 定下结果形状</text>

  <line x1="310" y1="170" x2="600" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="200" x2="600" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="444" width="810" height="62" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="90" y="468" class="t bt">共享可变状态先分开</text>
  <text x="90" y="490" class="t bs">同一文件、同一分支、同一配置、同一张表上的写入不是并行；先分 worktree 或让 P1 先定接口。</text>

  <text x="480" y="428" text-anchor="middle" class="t s">ready work 不是"最重要的包"，而是"现在就能开始的包"。</text>
</svg>
