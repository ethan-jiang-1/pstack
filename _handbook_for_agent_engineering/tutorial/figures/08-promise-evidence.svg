<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="承诺与证据的对照">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
      .v { font-size: 11px; font-weight: 700; }
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">承诺-证据对照</text>
  <text x="480" y="62" text-anchor="middle" class="t s">结论不是"全绿"，而是区分兑现、未兑现、未覆盖和无法结论；本图示范其中三类</text>

  <text x="80" y="100" class="t bt">原承诺</text>
  <text x="560" y="100" class="t bt">证据与覆盖边界</text>

  <rect x="60" y="116" width="400" height="54" rx="8" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="76" y="138" class="t bs">勾选 3 行 → 文件 3 行</text>
  <text x="76" y="158" class="t s">12 行数据，勾选 3 行</text>
  <rect x="560" y="116" width="340" height="54" rx="8" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="576" y="138" class="t bs">E2E 录屏 + 文件行数</text>
  <text x="576" y="158" class="t s">覆盖：3 行勾选；表头一致</text>
  <text x="910" y="148" class="t v" fill="#15803d">兑现</text>

  <rect x="60" y="186" width="400" height="54" rx="8" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="76" y="208" class="t bs">无勾选时按钮禁用</text>
  <text x="76" y="228" class="t s">初始空选择</text>
  <rect x="560" y="186" width="340" height="54" rx="8" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="576" y="208" class="t bs">组件测试 + 手工</text>
  <text x="576" y="228" class="t s">覆盖：初始状态；文案</text>
  <text x="910" y="218" class="t v" fill="#15803d">兑现</text>

  <rect x="60" y="256" width="400" height="54" rx="8" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="76" y="278" class="t bs">删除行后标注缺失</text>
  <text x="76" y="298" class="t s">1 行在导出前被删</text>
  <rect x="560" y="256" width="340" height="54" rx="8" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="576" y="278" class="t bs">单元测试</text>
  <text x="576" y="298" class="t s">覆盖：1 行缺失；missing 顺序</text>
  <text x="910" y="288" class="t v" fill="#15803d">兑现</text>

  <rect x="60" y="326" width="400" height="54" rx="8" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="76" y="348" class="t bs">无权限时 403 + 页面提示</text>
  <text x="76" y="368" class="t s">无权限用户</text>
  <rect x="560" y="326" width="340" height="54" rx="8" fill="#fef3c7" stroke="#fde68a"/>
  <text x="576" y="348" class="t bs">未运行</text>
  <text x="576" y="368" class="t s">覆盖：无</text>
  <text x="910" y="358" class="t v" fill="#b45309">未覆盖</text>

  <rect x="60" y="396" width="400" height="54" rx="8" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="76" y="418" class="t bs">5 万行以上的等待策略</text>
  <text x="76" y="438" class="t s">未定义</text>
  <rect x="560" y="396" width="340" height="54" rx="8" fill="#fee2e2" stroke="#fecaca"/>
  <text x="576" y="418" class="t bs">没有判据</text>
  <text x="576" y="438" class="t s">无法判断兑现与否</text>
  <text x="910" y="428" class="t v" fill="#b91c1c">无法结论</text>

  <line x1="460" y1="143" x2="560" y2="143" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="213" x2="560" y2="213" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="283" x2="560" y2="283" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="353" x2="560" y2="353" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="460" y1="423" x2="560" y2="423" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <text x="480" y="492" text-anchor="middle" class="t s">"应该没问题"不是结论；它只是把判断留给了下一位。</text>
  <text x="480" y="516" text-anchor="middle" class="t s">未覆盖与无法结论都要写进交付说明，并指定下一位 owner。</text>
</svg>
