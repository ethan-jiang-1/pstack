<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="摩擦、结构约束与承诺退役">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">让环境在下一轮更好</text>
  <text x="480" y="62" text-anchor="middle" class="t s">摩擦变成结构，过时承诺退役，上下文在阶段边界做决定</text>

  <rect x="40" y="100" width="260" height="96" rx="10" fill="#fee2e2" stroke="#fecaca"/>
  <text x="58" y="128" class="t bt">摩擦账本</text>
  <text x="58" y="150" class="t bs">评审、失败、信号、交接</text>
  <text x="58" y="170" class="t bs">事实 / 成本 / 条件 / 临时绕过</text>
  <text x="58" y="188" class="t s">两次以上才升级</text>

  <rect x="40" y="236" width="260" height="96" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="58" y="264" class="t bt">分类</text>
  <text x="58" y="286" class="t bs">结构：能被检查拦住</text>
  <text x="58" y="306" class="t bs">判断：需要情境权衡</text>
  <text x="58" y="324" class="t s">结构优先，判断才写文字</text>

  <rect x="40" y="372" width="260" height="112" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="58" y="400" class="t bt">结构约束</text>
  <text x="58" y="422" class="t bs">架构 → 类型 → lint → 测试</text>
  <text x="58" y="442" class="t bs">错误信息本身说怎么修</text>
  <text x="58" y="462" class="t bs">每条在历史错误上会失败</text>
  <text x="58" y="478" class="t s">文档最后</text>

  <line x1="170" y1="196" x2="170" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="332" x2="170" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="100" width="260" height="96" rx="10" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="398" y="128" class="t bt">累积产物</text>
  <text x="398" y="150" class="t bs">spec、ticket、决定、交接</text>
  <text x="398" y="170" class="t bs">风险不是数量，是没有状态</text>
  <text x="398" y="188" class="t s">下一位分不清哪份还算数</text>

  <rect x="380" y="236" width="260" height="96" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="398" y="264" class="t bt">退役记录</text>
  <text x="398" y="286" class="t bs">被什么取代、谁宣布</text>
  <text x="398" y="306" class="t bs">从何时起失效</text>
  <text x="398" y="324" class="t s">不删除历史，不就地改写</text>

  <rect x="380" y="372" width="260" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="398" y="400" class="t bt">入口清理</text>
  <text x="398" y="422" class="t bs">从当前入口摘除</text>
  <text x="398" y="442" class="t bs">旧件顶部指向取代者</text>
  <text x="398" y="462" class="t bs">保留历史，只改可读状态</text>

  <line x1="510" y1="196" x2="510" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="332" x2="510" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="680" y="100" width="240" height="384" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="700" y="128" class="t bt">阶段边界</text>
  <text x="700" y="154" class="t bs">下一段还需要这一段</text>
  <text x="700" y="172" class="t bs">作为一手来源吗？</text>
  <text x="700" y="204" class="t bs">继续：需要，窗口够</text>
  <text x="700" y="228" class="t bs">清空：只需要产物</text>
  <text x="700" y="252" class="t bs">交接：下一位要带走</text>
  <text x="700" y="276" class="t bs">交给 subagent：封闭批量</text>
  <text x="700" y="300" class="t bs">压缩：需要但窗口不够</text>
  <text x="700" y="334" class="t s">判断依据不是"感觉差不多"，</text>
  <text x="700" y="354" class="t s">而是下一段是否需要它。</text>
  <text x="700" y="392" class="t s">写下一次起点：</text>
  <text x="700" y="414" class="t bs">从哪节开始、先读什么、</text>
  <text x="700" y="434" class="t bs">哪些仍未覆盖。</text>

  <rect x="120" y="510" width="720" height="38" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="480" y="534" text-anchor="middle" class="t bs">下一次运行起步更好：一条会失败的检查，一份退役记录，或一个清楚的阶段边界。</text>
</svg>
