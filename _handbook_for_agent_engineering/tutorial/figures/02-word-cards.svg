<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="三个词卡如何把隐含分歧变成可见定义">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
      .lab { font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">给共同语言一个位置</text>
  <text x="480" y="62" text-anchor="middle" class="t s">只定义会改变实现的词；每个词四行，短到能贴进对话</text>

  <rect x="40" y="100" width="250" height="150" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="60" y="128" class="t bt">勾选</text>
  <text x="60" y="152" class="t bs">含义：当前结果里显式选中的行</text>
  <text x="60" y="176" class="t bs">是：跨页勾的 3 行都算</text>
  <text x="60" y="200" class="t bs">不是：全部筛选结果</text>
  <text x="60" y="224" class="t bs">边界：刷新后清空</text>

  <rect x="350" y="100" width="250" height="150" rx="12" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="370" y="128" class="t bt">导出</text>
  <text x="370" y="152" class="t bs">含义：浏览器内生成并下载 CSV</text>
  <text x="370" y="176" class="t bs">是：2 秒内开始下载</text>
  <text x="370" y="200" class="t bs">不是：后台任务、Excel</text>
  <text x="370" y="224" class="t bs">边界：5 万行仍走同一路径</text>

  <rect x="660" y="100" width="260" height="150" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="680" y="128" class="t bt">异常订单</text>
  <text x="680" y="152" class="t bs">含义：failed 或 refunded 且金额 &gt; 0</text>
  <text x="680" y="176" class="t bs">是：失败且金额 120 元</text>
  <text x="680" y="200" class="t bs">不是：所有非 paid；金额 0</text>
  <text x="680" y="224" class="t bs">边界：按当前状态，不按历史</text>

  <rect x="40" y="300" width="380" height="86" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="328" class="t bt">两个测试问题</text>
  <text x="60" y="350" class="t bs">跨页勾 3 行，导出几行？</text>
  <text x="60" y="370" class="t bs">没有勾选时，按钮怎样？</text>

  <rect x="470" y="300" width="450" height="86" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="490" y="328" class="t bt">答错时改哪一句</text>
  <text x="490" y="350" class="t bs">不要重写整张卡；先问 agent 依据哪一句，再修那一句。</text>
  <text x="490" y="370" class="t bs">定义的价值在于能被引用，不在于写得漂亮。</text>

  <line x1="165" y1="250" x2="165" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="250" x2="475" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="790" y1="250" x2="750" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="432" width="660" height="64" rx="12" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="480" y="458" text-anchor="middle" class="t bt">词卡附着到共同问题，后续行为卡、测试、评审都用同一组词</text>
  <text x="480" y="480" text-anchor="middle" class="t s">不建大词表；只收曾经改变过决定的词，方向变了就删</text>

  <text x="480" y="530" text-anchor="middle" class="t s">一个词定了就不再换同义词；换词会让读者以为在学新概念</text>
</svg>
