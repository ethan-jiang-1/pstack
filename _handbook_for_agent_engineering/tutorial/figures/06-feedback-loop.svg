<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="一条能变红的回路">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">先红，再绿</text>
  <text x="480" y="62" text-anchor="middle" class="t s">没有见过红的绿，只是"测试和实现互相同意"</text>

  <rect x="50" y="110" width="180" height="90" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="68" y="138" class="t bt">行为卡</text>
  <text x="68" y="160" class="t bs">勾选 3 行 → 3 行 CSV</text>
  <text x="68" y="180" class="t bs">切口：export()</text>

  <rect x="270" y="110" width="190" height="90" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="288" y="138" class="t bt">独立预期</text>
  <text x="288" y="160" class="t bs">来自共同问题与词卡</text>
  <text x="288" y="180" class="t bs">不是实现步骤</text>

  <rect x="500" y="110" width="170" height="90" rx="10" fill="#fee2e2" stroke="#fecaca"/>
  <text x="518" y="138" class="t bt">红</text>
  <text x="518" y="160" class="t bs">因为正确的原因失败</text>
  <text x="518" y="180" class="t bs">不是环境或导入错误</text>

  <rect x="710" y="110" width="200" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="728" y="138" class="t bt">最小实现</text>
  <text x="728" y="160" class="t bs">只做当前检查要求的事</text>
  <text x="728" y="180" class="t bs">不加检查没要求的分支</text>

  <rect x="710" y="270" width="200" height="90" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="728" y="298" class="t bt">绿</text>
  <text x="728" y="320" class="t bs">同一检查通过</text>
  <text x="728" y="340" class="t bs">失败输出保留</text>

  <rect x="440" y="270" width="220" height="90" rx="10" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="458" y="298" class="t bt">回路卡</text>
  <text x="458" y="320" class="t bs">命令、输入、预期</text>
  <text x="458" y="340" class="t bs">覆盖边界</text>

  <rect x="120" y="270" width="260" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="138" y="298" class="t bt">稳定、快、可无人值守</text>
  <text x="138" y="320" class="t bs">不依赖时钟、网络、随机顺序</text>
  <text x="138" y="340" class="t bs">每次小改动后都能跑</text>

  <line x1="230" y1="155" x2="270" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="155" x2="500" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="155" x2="710" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="200" x2="810" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="315" x2="660" y2="315" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="315" x2="380" y2="315" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="270" x2="250" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="430" width="600" height="60" rx="12" fill="#fee2e2" stroke="#fecaca"/>
  <text x="480" y="456" text-anchor="middle" class="t bt">如果检查一开始就是绿的，先修检查，不要写实现</text>
  <text x="480" y="476" text-anchor="middle" class="t s">常见原因：断言太弱、mock 了返回值、行为已被旧代码实现。</text>
</svg>
