<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="承诺-证据对照：每条承诺的证据、覆盖边界与四种结论">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11px; fill: #475569; }
      .v { font-size: 11px; font-weight: 700; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">承诺-证据对照</text>
  <text x="480" y="62" text-anchor="middle" class="t s">从承诺出发找证据；每条承诺一个结论，不用"测试全绿"代替</text>

  <text x="40" y="100" class="t bt">承诺</text>
  <text x="330" y="100" class="t bt">证据</text>
  <text x="560" y="100" class="t bt">覆盖边界</text>
  <text x="760" y="100" class="t bt">结论</text>

  <rect x="40" y="116" width="260" height="58" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="54" y="138" class="t bs">勾选 3 行导出 3 行</text>
  <text x="54" y="158" class="t s">行为地图 #1</text>
  <rect x="320" y="116" width="220" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="334" y="138" class="t bs">回路 + 真实文件</text>
  <text x="334" y="158" class="t s">测试 + 手工一次</text>
  <rect x="560" y="116" width="180" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="574" y="138" class="t bs">12 行、3 行勾选</text>
  <text x="574" y="158" class="t s">表头一致</text>
  <text x="770" y="148" class="t v" fill="#15803d">兑现</text>

  <rect x="40" y="184" width="260" height="58" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="54" y="206" class="t bs">无勾选不导出</text>
  <text x="54" y="226" class="t s">行为地图 #2</text>
  <rect x="320" y="184" width="220" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="334" y="206" class="t bs">组件测试</text>
  <text x="334" y="226" class="t s">按钮禁用 + 提示</text>
  <rect x="560" y="184" width="180" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="574" y="206" class="t bs">初始空选择</text>
  <text x="574" y="226" class="t s">不含权限场景</text>
  <text x="770" y="216" class="t v" fill="#15803d">兑现</text>

  <rect x="40" y="252" width="260" height="58" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="54" y="274" class="t bs">删除行后标注缺失</text>
  <text x="54" y="294" class="t s">行为地图 #3</text>
  <rect x="320" y="252" width="220" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="334" y="274" class="t bs">单元测试</text>
  <text x="334" y="294" class="t s">missing 含该 id</text>
  <rect x="560" y="252" width="180" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="574" y="274" class="t bs">1 行缺失</text>
  <text x="574" y="294" class="t s">不含多行缺失</text>
  <text x="770" y="284" class="t v" fill="#15803d">兑现</text>

  <rect x="40" y="320" width="260" height="58" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="54" y="342" class="t bs">无权限时 403 + 提示</text>
  <text x="54" y="362" class="t s">行为地图 #4</text>
  <rect x="320" y="320" width="220" height="58" rx="6" fill="#fef3c7" stroke="#fde68a"/>
  <text x="334" y="342" class="t bs">未运行</text>
  <text x="334" y="362" class="t s">无证据</text>
  <rect x="560" y="320" width="180" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="574" y="342" class="t bs">无</text>
  <text x="770" y="348" class="t v" fill="#b45309">未覆盖</text>

  <rect x="40" y="388" width="260" height="58" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="54" y="410" class="t bs">5 万行以上等待策略</text>
  <text x="54" y="430" class="t s">非功能承诺</text>
  <rect x="320" y="388" width="220" height="58" rx="6" fill="#fee2e2" stroke="#fecaca"/>
  <text x="334" y="410" class="t bs">没有判据</text>
  <text x="334" y="430" class="t s">无法判断兑现与否</text>
  <rect x="560" y="388" width="180" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="574" y="410" class="t bs">未定义</text>
  <text x="770" y="416" class="t v" fill="#b91c1c">无法结论</text>

  <rect x="40" y="476" width="880" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="500" class="t bt">四种结论：兑现 / 未兑现 / 未覆盖 / 无法结论</text>
  <text x="60" y="518" class="t s">"应该没问题"不是结论；未覆盖与无法结论要有 owner 与下一步。</text>

  <text x="480" y="550" text-anchor="middle" class="t s">对照表让没参加实现的人也能判断：这条承诺兑现了没有，证据证明到哪里。</text>
</svg>
