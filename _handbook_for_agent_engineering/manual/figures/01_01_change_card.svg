<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="变更工作卡的字段与来源">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
      .q { font-size: 12px; fill: #334155; }
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">变更工作卡</text>
  <text x="480" y="62" text-anchor="middle" class="t s">原始请求只是输入；共同问题要补齐边界、非目标、owner 与未知项</text>

  <rect x="40" y="100" width="250" height="150" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="58" y="128" class="t bt">原始请求</text>
  <text x="58" y="154" class="t q">"给导出功能加个筛选，</text>
  <text x="58" y="174" class="t q">只导出我选中的行。"</text>
  <text x="58" y="204" class="t s">来源：Slack，2026-10-18</text>
  <text x="58" y="224" class="t s">原样记录，先不润色</text>

  <rect x="330" y="100" width="250" height="260" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="348" y="128" class="t bt">补齐四个缺口</text>
  <text x="348" y="158" class="t bs">谁，在什么时刻用</text>
  <text x="348" y="186" class="t bs">什么行为要改变</text>
  <text x="348" y="214" class="t bs">什么明确不能变</text>
  <text x="348" y="242" class="t bs">怎样算完成</text>
  <text x="348" y="278" class="t s">补不出的格子写成"未知"，</text>
  <text x="348" y="298" class="t s">不要用默认值填满。</text>
  <text x="348" y="330" class="t s">最后让一个没参加讨论的人</text>
  <text x="348" y="350" class="t s">复述一遍。</text>

  <rect x="620" y="100" width="300" height="330" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="640" y="128" class="t bt">变更工作卡</text>
  <text x="640" y="154" class="t bs">原始请求 + 来源与日期</text>
  <text x="640" y="178" class="t bs">目标使用者与时刻</text>
  <text x="640" y="202" class="t bs">要改变的行为</text>
  <text x="640" y="226" class="t bs">非目标（至少两条）</text>
  <text x="640" y="250" class="t bs">硬约束</text>
  <text x="640" y="274" class="t bs">完成判据（可观察）</text>
  <text x="640" y="298" class="t bs">未知项（带 owner）</text>
  <text x="640" y="322" class="t bs">owner 与下一次确认</text>
  <text x="640" y="356" class="t s">它不是 spec，也不是实施方案；</text>
  <text x="640" y="376" class="t s">它只保证讨论的是同一个问题。</text>
  <text x="640" y="404" class="t s">卡里没有实施方案。</text>

  <line x1="290" y1="175" x2="330" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="220" x2="620" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="466" width="600" height="48" rx="10" fill="#fee2e2" stroke="#fecaca"/>
  <text x="480" y="496" text-anchor="middle" class="t bs">没有 owner 的未知项，会在实现时被某个默认值填满。</text>
</svg>
