<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="失败回流：事实、重放、权威预期、四类路由与关闭证据">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">失败回流</text>
  <text x="480" y="62" text-anchor="middle" class="t s">先止损，再分事实与假设；先判断回到哪一层，再改代码</text>

  <rect x="40" y="100" width="220" height="220" rx="12" fill="#fee2e2" stroke="#fecaca"/>
  <text x="58" y="128" class="t bt">失败信号</text>
  <text x="58" y="152" class="t bs">错误率上升 / 测试红 /</text>
  <text x="58" y="172" class="t bs">评审发现 / 用户报告</text>
  <text x="58" y="204" class="t bs">先止损：</text>
  <text x="58" y="224" class="t bs">关 flag / 回滚 / 限暴露</text>
  <text x="58" y="258" class="t s">止损不需要等根因；</text>
  <text x="58" y="278" class="t s">但要记录谁、何时、影响。</text>

  <rect x="320" y="92" width="280" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="338" y="118" class="t bt">事实 / 假设分开</text>
  <text x="338" y="140" class="t bs">只写能观察到的；假设标未验证</text>

  <rect x="320" y="184" width="280" height="70" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="338" y="210" class="t bt">最小重放</text>
  <text x="338" y="232" class="t bs">能稳定复现失败的最小输入</text>

  <rect x="320" y="276" width="280" height="70" rx="10" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="338" y="302" class="t bt">权威预期</text>
  <text x="338" y="324" class="t bs">spec / 行为卡 / 独立判据</text>

  <rect x="660" y="92" width="260" height="70" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="678" y="118" class="t bt">定义</text>
  <text x="678" y="140" class="t bs">需求、边界、验收不清或错</text>
  <text x="678" y="156" class="t s">回到 spec / 工作卡 / 行为地图</text>

  <rect x="660" y="176" width="260" height="70" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="678" y="202" class="t bt">设计</text>
  <text x="678" y="224" class="t bs">形状、接口、切口导致无法实现</text>
  <text x="678" y="240" class="t s">回到模块形状卡 / 依赖图</text>

  <rect x="660" y="260" width="260" height="70" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="678" y="286" class="t bt">实现</text>
  <text x="678" y="308" class="t bs">代码没有按已确认行为工作</text>
  <text x="678" y="324" class="t s">回到工作包 / 代码</text>

  <rect x="660" y="344" width="260" height="70" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="678" y="370" class="t bt">验证</text>
  <text x="678" y="392" class="t bs">测试、判据或覆盖边界错了</text>
  <text x="678" y="408" class="t s">回到回路卡 / 承诺-证据表</text>

  <line x1="260" y1="180" x2="320" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="210" x2="320" y2="219" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="240" x2="320" y2="311" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="127" x2="660" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="219" x2="660" y2="211" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="311" x2="660" y2="295" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="340" x2="660" y2="379" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="450" width="600" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="480" y="476" text-anchor="middle" class="t bt">目标产物 + owner + 关闭证据</text>
  <text x="480" y="498" text-anchor="middle" class="t s">关闭证据：重放由红变绿；真实表面恢复；新增检查在旧版本上会失败。</text>

  <text x="480" y="540" text-anchor="middle" class="t s">同一类失败第二次出现，不要只修实例：把它变成一条结构约束。</text>
</svg>
