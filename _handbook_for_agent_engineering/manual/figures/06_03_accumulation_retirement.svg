<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="累积清单、退役记录、入口清理与阶段边界">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11px; fill: #475569; }
      .v { font-size: 10.5px; font-weight: 700; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">累积、退役与阶段边界</text>
  <text x="480" y="62" text-anchor="middle" class="t s">风险不来自数量，而来自没有状态：读的人分不清哪份还算数</text>

  <rect x="40" y="100" width="280" height="280" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="58" y="128" class="t bt">累积清单</text>
  <rect x="58" y="142" width="244" height="42" rx="6" fill="#fee2e2" stroke="#fecaca"/>
  <text x="72" y="160" class="t bs">导出 spec v1</text>
  <text x="250" y="160" class="t v" fill="#b91c1c">已退役</text>
  <text x="72" y="176" class="t s">被 v2 取代</text>
  <rect x="58" y="192" width="244" height="42" rx="6" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="72" y="210" class="t bs">导出 spec v2</text>
  <text x="250" y="210" class="t v" fill="#15803d">有效</text>
  <text x="72" y="226" class="t s">当前方向</text>
  <rect x="58" y="242" width="244" height="42" rx="6" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="72" y="260" class="t bs">勾选行为卡</text>
  <text x="250" y="260" class="t v" fill="#15803d">有效</text>
  <text x="72" y="276" class="t s">链到当前 spec</text>
  <rect x="58" y="292" width="244" height="42" rx="6" fill="#fef3c7" stroke="#fde68a"/>
  <text x="72" y="310" class="t bs">三个月前的决定</text>
  <text x="238" y="310" class="t v" fill="#b45309">部分失效</text>
  <text x="72" y="326" class="t s">"不做 Excel" 已不成立</text>
  <rect x="58" y="342" width="244" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="72" y="362" class="t bs">旧 PR 讨论</text>
  <text x="250" y="362" class="t v" fill="#64748b">历史</text>

  <rect x="370" y="100" width="260" height="180" rx="12" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="388" y="128" class="t bt">退役记录</text>
  <text x="388" y="152" class="t bs">被退役：spec v1</text>
  <text x="388" y="174" class="t bs">取代者：spec v2</text>
  <text x="388" y="196" class="t bs">宣布人：具名人</text>
  <text x="388" y="218" class="t bs">生效：2026-10-19</text>
  <text x="388" y="240" class="t bs">入口处理：从首页移除</text>
  <text x="388" y="262" class="t bs">历史保留，供追溯</text>

  <rect x="370" y="310" width="260" height="170" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="388" y="338" class="t bt">阶段边界</text>
  <text x="388" y="362" class="t bs">继续：仍需要一手来源</text>
  <text x="388" y="384" class="t bs">清空：只需要产物</text>
  <text x="388" y="406" class="t bs">交接：下一位要带走</text>
  <text x="388" y="428" class="t bs">交给 subagent：封闭批量</text>
  <text x="388" y="450" class="t bs">压缩：需要但窗口不够</text>
  <text x="388" y="470" class="t s">判断依据：下一段是否还需要它。</text>

  <rect x="680" y="100" width="240" height="180" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="698" y="128" class="t bt">入口清理</text>
  <text x="698" y="152" class="t bs">文档首页</text>
  <text x="698" y="174" class="t bs">README / onboarding</text>
  <text x="698" y="196" class="t bs">issue 模板 / 旧链接</text>
  <text x="698" y="226" class="t s">只在旧文件顶部加一行</text>
  <text x="698" y="246" class="t s">"已退役" 不够；</text>
  <text x="698" y="266" class="t s">下一位可能从搜索进入。</text>

  <rect x="680" y="310" width="240" height="170" rx="12" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="698" y="338" class="t bt">下一次起点</text>
  <text x="698" y="362" class="t bs">从 spec v2 §3 开始</text>
  <text x="698" y="384" class="t bs">先读行为卡与证据表</text>
  <text x="698" y="406" class="t bs">未覆盖：超大文件策略</text>
  <text x="698" y="436" class="t s">比一份长总结更有用：</text>
  <text x="698" y="456" class="t s">下一位知道从哪里接。</text>

  <line x1="320" y1="210" x2="370" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="210" x2="680" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="385" x2="680" y2="385" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="524" text-anchor="middle" class="t s">归档是"移到一边"；退役是"明确不再作为输入，并从入口摘除"。只归档不退役，旧链接仍可进入。</text>
</svg>
