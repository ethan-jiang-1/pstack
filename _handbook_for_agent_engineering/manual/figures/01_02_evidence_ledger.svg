<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="事实、假设、意见与未知项的分流">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">把四种句子分开</text>
  <text x="480" y="62" text-anchor="middle" class="t s">分开之前都像背景信息；分开之后，才知道哪一条需要行动</text>

  <rect x="40" y="100" width="260" height="90" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="58" y="128" class="t bt">事实</text>
  <text x="58" y="150" class="t bs">有来源、有适用范围</text>
  <text x="58" y="170" class="t bs">"接口只支持全量，exporter.ts:42"</text>

  <rect x="40" y="210" width="260" height="90" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="58" y="238" class="t bt">假设</text>
  <text x="58" y="260" class="t bs">有验证方式、有 owner</text>
  <text x="58" y="280" class="t bs">"可能是权限发布导致的"</text>

  <rect x="40" y="320" width="260" height="90" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="58" y="348" class="t bt">意见</text>
  <text x="58" y="370" class="t bs">有提出者、有权衡判据</text>
  <text x="58" y="390" class="t bs">"财务倾向 Excel，因为手工成本"</text>

  <rect x="40" y="430" width="260" height="72" rx="10" fill="#fee2e2" stroke="#fecaca"/>
  <text x="58" y="458" class="t bt">未知</text>
  <text x="58" y="480" class="t bs">影响哪个决定、谁来回答</text>

  <rect x="380" y="100" width="240" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="398" y="128" class="t bt">进入约束</text>
  <text x="398" y="150" class="t bs">成为设计边界</text>
  <text x="398" y="170" class="t bs">过期要重审</text>

  <rect x="380" y="210" width="240" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="398" y="238" class="t bt">进入验证</text>
  <text x="398" y="260" class="t bs">写清成立/不成立各看到什么</text>
  <text x="398" y="280" class="t bs">最小动作 + 时间盒</text>

  <rect x="380" y="320" width="240" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="398" y="348" class="t bt">进入权衡</text>
  <text x="398" y="370" class="t bs">谁的意见、按什么判据</text>
  <text x="398" y="390" class="t bs">不要包装成事实</text>

  <rect x="380" y="430" width="240" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="398" y="458" class="t bt">进入问题清单</text>
  <text x="398" y="480" class="t bs">有 owner 与关闭时间</text>

  <rect x="700" y="100" width="220" height="402" rx="12" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="720" y="128" class="t bt">事实底稿</text>
  <text x="720" y="154" class="t bs">主张 | 类型 | 来源</text>
  <text x="720" y="174" class="t bs">日期 | 适用范围 | 状态 | owner</text>
  <text x="720" y="210" class="t s">每条一行；</text>
  <text x="720" y="230" class="t s">没有来源的陈述</text>
  <text x="720" y="250" class="t s">不是事实。</text>
  <text x="720" y="288" class="t bs">定期重审：</text>
  <text x="720" y="310" class="t bs">事实会过期，</text>
  <text x="720" y="330" class="t bs">假设会被推翻。</text>
  <text x="720" y="368" class="t s">底稿的目的不是</text>
  <text x="720" y="388" class="t s">消除不确定性，</text>
  <text x="720" y="408" class="t s">而是让它有状态、</text>
  <text x="720" y="428" class="t s">有 owner、有代价。</text>

  <line x1="300" y1="145" x2="380" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="255" x2="380" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="365" x2="380" y2="365" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="466" x2="380" y2="466" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="255" x2="700" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="524" text-anchor="middle" class="t s">"大家都同意"不是来源；"没找到反证"也不是事实。</text>
</svg>
