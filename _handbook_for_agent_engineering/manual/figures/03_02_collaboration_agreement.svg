<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="协作约定">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">协作约定</text>
  <text x="480" y="62" text-anchor="middle" class="t s">围绕一项具体变更：谁决定、谁执行、谁集成、卡住找谁</text>

  <rect x="330" y="88" width="300" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="480" y="112" text-anchor="middle" class="t bt">变更与范围</text>
  <text x="480" y="132" text-anchor="middle" class="t bs">改什么、不改什么</text>

  <rect x="40" y="180" width="260" height="150" rx="12" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="58" y="208" class="t bt">decision owner</text>
  <text x="58" y="232" class="t bs">范围、优先级、取舍</text>
  <text x="58" y="254" class="t bs">最终决定</text>
  <text x="58" y="284" class="t s">可以是具名的人，</text>
  <text x="58" y="304" class="t s">不能是"团队"。</text>

  <rect x="350" y="180" width="260" height="150" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="368" y="208" class="t bt">executors</text>
  <text x="368" y="232" class="t bs">每条工作线一个执行者</text>
  <text x="368" y="254" class="t bs">可写范围 / 禁止动作</text>
  <text x="368" y="284" class="t s">执行者提供证据，</text>
  <text x="368" y="304" class="t s">不默认拥有决定权。</text>

  <rect x="660" y="180" width="260" height="150" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="678" y="208" class="t bt">integration owner</text>
  <text x="678" y="232" class="t bs">汇合、文本冲突、联合行为</text>
  <text x="678" y="254" class="t bs">确认最终一致性</text>
  <text x="678" y="284" class="t s">解决文本冲突，</text>
  <text x="678" y="304" class="t s">不独断语义冲突。</text>

  <rect x="350" y="370" width="260" height="110" rx="12" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="368" y="398" class="t bt">共享产物 owner</text>
  <text x="368" y="422" class="t bs">spec · 行为地图 · 接口</text>
  <text x="368" y="444" class="t bs">验证证据 · 发布说明</text>
  <text x="368" y="466" class="t s">每个产物恰有一个具名 owner。</text>

  <rect x="40" y="370" width="260" height="110" rx="12" fill="#fee2e2" stroke="#fecaca"/>
  <text x="58" y="398" class="t bt">human gates</text>
  <text x="58" y="422" class="t bs">合并 · 部署 · 权限/数据</text>
  <text x="58" y="444" class="t bs">外部消息 · 不可逆动作</text>
  <text x="58" y="466" class="t s">每个 gate：谁批准、要什么证据、默认怎么办。</text>

  <rect x="660" y="370" width="260" height="110" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="678" y="398" class="t bt">escalation</text>
  <text x="678" y="422" class="t bs">第一联系人</text>
  <text x="678" y="444" class="t bs">多久升级、升级给谁</text>
  <text x="678" y="466" class="t s">没人回应时的默认动作：停 / 退 / 继续。</text>

  <line x1="170" y1="330" x2="170" y2="370" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="330" x2="420" y2="370" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="790" y1="330" x2="790" y2="370" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="480" y="530" text-anchor="middle" class="t s">协作约定不是组织架构图；它只回答这项变更的四个问题：谁决定、谁执行、谁集成、卡住找谁。</text>
</svg>
