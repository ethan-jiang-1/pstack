<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="运行信号记录：上下文、基线、事实与假设、止损、下一步">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">运行信号记录</text>
  <text x="480" y="62" text-anchor="middle" class="t s">先把信号放回上下文，再把事实与假设分开，最后选一个入口</text>

  <rect x="40" y="100" width="240" height="160" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="58" y="128" class="t bt">固定上下文</text>
  <text x="58" y="152" class="t bs">版本与配置</text>
  <text x="58" y="174" class="t bs">暴露范围：谁/哪些数据</text>
  <text x="58" y="196" class="t bs">时间：首次、持续</text>
  <text x="58" y="218" class="t bs">基线：正常值是多少</text>
  <text x="58" y="240" class="t bs">原始样本：日志/trace/截图</text>

  <rect x="330" y="100" width="260" height="160" rx="12" fill="#fee2e2" stroke="#fecaca"/>
  <text x="348" y="128" class="t bt">事实与假设分开</text>
  <text x="348" y="154" class="t bs">事实：14:05 起从 0.4% 到 3.1%</text>
  <text x="348" y="176" class="t bs">集中在 12 个内部账号</text>
  <text x="348" y="204" class="t bs">假设：可能是权限发布导致</text>
  <text x="348" y="226" class="t bs">标明：未验证</text>
  <text x="348" y="250" class="t s">不要把假设写成根因。</text>

  <rect x="640" y="100" width="280" height="160" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="658" y="128" class="t bt">止损优先</text>
  <text x="658" y="154" class="t bs">关 flag / 回滚 / 限制暴露</text>
  <text x="658" y="178" class="t bs">记录谁做的、什么时候</text>
  <text x="658" y="202" class="t bs">止损不需要等根因分析</text>
  <text x="658" y="230" class="t s">影响持续或扩大时，先恢复服务。</text>

  <rect x="330" y="310" width="260" height="150" rx="12" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="348" y="338" class="t bt">下一步：四个入口</text>
  <text x="348" y="364" class="t bs">失败回流：有明确症状</text>
  <text x="348" y="386" class="t bs">重新定义：承诺不再成立</text>
  <text x="348" y="408" class="t bs">补观察：信号太弱/噪声大</text>
  <text x="348" y="430" class="t bs">继续观察：影响可控</text>

  <rect x="640" y="310" width="280" height="150" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="658" y="338" class="t bt">owner 与关闭条件</text>
  <text x="658" y="364" class="t bs">错误率回到基线</text>
  <text x="658" y="386" class="t bs">重放由红变绿</text>
  <text x="658" y="408" class="t bs">新增检查在旧版本上会失败</text>
  <text x="658" y="430" class="t bs">影响范围确认清零</text>

  <line x1="280" y1="180" x2="330" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="180" x2="640" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="260" x2="460" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="385" x2="640" y2="385" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="506" text-anchor="middle" class="t s">不要所有信号都直接开修；先判断它属于哪一类，再决定动作。</text>
  <text x="480" y="530" text-anchor="middle" class="t s">结论要写回权威位置，不能只留在群里。</text>
</svg>
