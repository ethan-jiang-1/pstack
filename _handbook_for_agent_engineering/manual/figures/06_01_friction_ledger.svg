<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="摩擦账本：多源记录、共同机制、杠杆与改进提案">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">摩擦账本与改进提案</text>
  <text x="480" y="62" text-anchor="middle" class="t s">从独立记录里找共同机制，再选一个主要杠杆；不是按情绪排序的债单</text>

  <rect x="40" y="100" width="200" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="126" class="t bt">评审评论</text>
  <text x="58" y="148" class="t s">第三次"漏了 missing"</text>
  <rect x="40" y="186" width="200" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="212" class="t bt">失败回流</text>
  <text x="58" y="234" class="t s">边界没写清导致返工</text>
  <rect x="40" y="272" width="200" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="298" class="t bt">运行信号</text>
  <text x="58" y="320" class="t s">缺失行数量上升</text>
  <rect x="40" y="358" width="200" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="384" class="t bt">交接</text>
  <text x="58" y="406" class="t s">下一位花半天搞清状态</text>

  <rect x="290" y="100" width="250" height="328" rx="12" fill="#fee2e2" stroke="#fecaca"/>
  <text x="310" y="128" class="t bt">摩擦账本</text>
  <text x="310" y="154" class="t bs">来源 · 事实 · 成本</text>
  <text x="310" y="176" class="t bs">条件 · 反例</text>
  <text x="310" y="198" class="t bs">临时绕过</text>
  <text x="310" y="220" class="t bs">机制假设（未证实）</text>
  <text x="310" y="242" class="t bs">下一步</text>
  <text x="310" y="278" class="t s">同一条件下重复，</text>
  <text x="310" y="298" class="t s">可能只是一个未修问题；</text>
  <text x="310" y="318" class="t s">不同条件下重复，</text>
  <text x="310" y="338" class="t s">才更像机制。</text>
  <text x="310" y="374" class="t s">至少两类独立记录，</text>
  <text x="310" y="394" class="t s">才值得升级。</text>

  <rect x="590" y="100" width="330" height="120" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="610" y="128" class="t bt">共同机制：一句话</text>
  <text x="610" y="154" class="t bs">缺失行用可选字段表达，</text>
  <text x="610" y="176" class="t bs">调用方可以合法忽略，</text>
  <text x="610" y="198" class="t bs">所以反复静默丢弃。</text>

  <rect x="590" y="240" width="330" height="112" rx="12" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="610" y="268" class="t bt">主要杠杆：只选一个</text>
  <text x="610" y="292" class="t bs">架构 / 定义 / 流程产物 / 观测</text>
  <text x="610" y="314" class="t bs">多杠杆同时改，很难判断哪部分有效。</text>
  <text x="610" y="336" class="t s">高风险用强杠杆；判断题才用文档。</text>

  <rect x="590" y="372" width="330" height="140" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="610" y="400" class="t bt">改进提案</text>
  <text x="610" y="424" class="t bs">范围 / 非目标</text>
  <text x="610" y="446" class="t bs">最小第一步（一周内）</text>
  <text x="610" y="468" class="t bs">保护性验证 + 停止条件</text>
  <text x="610" y="490" class="t bs">owner + 迁移约束</text>

  <line x1="240" y1="135" x2="290" y2="135" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="221" x2="290" y2="221" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="307" x2="290" y2="307" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="393" x2="290" y2="393" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="160" x2="590" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="296" x2="590" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="380" x2="590" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="530" text-anchor="middle" class="t s">改进也可能失败：N 次工作后摩擦没减少，先检查验证是否有效，再决定回滚或换杠杆。</text>
</svg>
