<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="交付风险结论：版本、暴露范围、证据、风险、信号、回退与 owner">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">交付风险结论</text>
  <text x="480" y="62" text-anchor="middle" class="t s">部署、暴露、交付是三个状态；结论只能是现在交付、限制暴露、等待补证据或不交付</text>

  <rect x="40" y="100" width="250" height="100" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="58" y="128" class="t bt">部署</text>
  <text x="58" y="152" class="t bs">固定版本进入环境</text>
  <text x="58" y="174" class="t bs">代码在，开关可以关着</text>
  <text x="58" y="192" class="t s">不等于任何用户能用</text>

  <rect x="350" y="100" width="250" height="100" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="368" y="128" class="t bt">暴露</text>
  <text x="368" y="152" class="t bs">允许具体用户/系统触发</text>
  <text x="368" y="174" class="t bs">内部 12 人 / 百分比 / 单租户</text>
  <text x="368" y="192" class="t s">小边界让失败成本可控</text>

  <rect x="660" y="100" width="260" height="100" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="678" y="128" class="t bt">交付</text>
  <text x="678" y="152" class="t bs">具名人基于证据与风险批准</text>
  <text x="678" y="174" class="t bs">版本 + 范围 + 观察 + 回退</text>
  <text x="678" y="192" class="t s">可以被限制、等待或不交付</text>

  <line x1="290" y1="150" x2="350" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="150" x2="660" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="240" width="430" height="230" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="268" class="t bt">结论卡</text>
  <text x="60" y="294" class="t bs">版本与提交：固定到 commit</text>
  <text x="60" y="318" class="t bs">部署目标 / 暴露范围</text>
  <text x="60" y="342" class="t bs">证据：承诺-证据、评审、未关闭回流</text>
  <text x="60" y="366" class="t bs">具体风险：影响谁、触发条件、缓解</text>
  <text x="60" y="390" class="t bs">运行信号：基线、判据、owner</text>
  <text x="60" y="414" class="t bs">停止 / 回退 / 补救</text>
  <text x="60" y="438" class="t bs">owner + 风险接受人 + 重新打开条件</text>

  <rect x="520" y="240" width="400" height="230" rx="12" fill="#fee2e2" stroke="#fecaca"/>
  <text x="540" y="268" class="t bt">回退要在暴露之前写好</text>
  <text x="540" y="294" class="t bs">关 flag / 回滚版本 / 停暴露</text>
  <text x="540" y="318" class="t bs">回滚数据（如果写了数据）</text>
  <text x="540" y="342" class="t bs">通知受影响用户</text>
  <text x="540" y="372" class="t s">触发条件、执行人、预计耗时。</text>
  <text x="540" y="396" class="t s">暴露前至少演练一次。</text>
  <text x="540" y="428" class="t s">等出事再想怎么退，通常已经太晚。</text>

  <line x1="770" y1="200" x2="770" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="355" x2="520" y2="355" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="512" text-anchor="middle" class="t s">"应该没问题"不是结论；它只是把风险留给了用户和第二天值班的人。</text>
  <text x="480" y="536" text-anchor="middle" class="t s">每个空格都要有人填；填不出来的格子，就是还没准备好的地方。</text>
</svg>
