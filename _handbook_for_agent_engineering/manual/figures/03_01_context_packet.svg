<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="任务上下文包">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">任务上下文包</text>
  <text x="480" y="62" text-anchor="middle" class="t s">让陌生执行者只靠这一份开始；事实给指针，决定给人，证据给下一步</text>

  <rect x="40" y="100" width="220" height="220" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="58" y="128" class="t bt">权威产物</text>
  <rect x="58" y="142" width="184" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="163" class="t bs">共同问题</text>
  <rect x="58" y="184" width="184" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="205" class="t bs">行为卡</text>
  <rect x="58" y="226" width="184" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="247" class="t bs">模块形状卡</text>
  <rect x="58" y="268" width="184" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="289" class="t bs">工作包</text>

  <rect x="320" y="90" width="330" height="360" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="340" y="118" class="t bt">上下文包</text>
  <text x="340" y="146" class="t bs">目标：一句话，什么会不同</text>
  <text x="340" y="170" class="t bs">完成判据：能跑的检查</text>
  <text x="340" y="194" class="t bs">权威产物：指针，不是副本</text>
  <text x="340" y="218" class="t bs">可写范围 / 不可写</text>
  <text x="340" y="242" class="t bs">禁止动作：不能改的入口与依赖</text>
  <text x="340" y="266" class="t bs">权限与人工 gate</text>
  <text x="340" y="290" class="t bs">报告形状：状态 / 提交 / 运行 / 偏差</text>
  <text x="340" y="314" class="t bs">时限与停止条件</text>
  <text x="340" y="338" class="t bs">上下文：执行者确实拿不到的那一小段</text>
  <text x="340" y="372" class="t s">只有执行者到不了的内容才粘贴；</text>
  <text x="340" y="392" class="t s">粘贴要标来源与日期。</text>
  <text x="340" y="424" class="t s">陌生人测试：四问能答上来才算写好。</text>

  <rect x="710" y="100" width="210" height="100" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="728" y="128" class="t bt">执行者</text>
  <text x="728" y="152" class="t bs">独立开始</text>
  <text x="728" y="174" class="t bs">事实自己查</text>
  <text x="728" y="196" class="t s">决定不越权</text>

  <rect x="710" y="250" width="210" height="120" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="728" y="278" class="t bt">报告</text>
  <text x="728" y="302" class="t bs">状态 / 分支 / 提交</text>
  <text x="728" y="324" class="t bs">实际运行与结果</text>
  <text x="728" y="346" class="t bs">偏差与未决项</text>

  <line x1="260" y1="210" x2="320" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="160" x2="710" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="300" x2="650" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>

  <rect x="180" y="480" width="600" height="50" rx="10" fill="#fee2e2" stroke="#fecaca"/>
  <text x="480" y="504" text-anchor="middle" class="t bt">默认新上下文；只有状态搬不走时才续用</text>
  <text x="480" y="522" text-anchor="middle" class="t s">续用时把新指令、旧报告、当前分支合并成一份 consolidated scope。</text>
</svg>
