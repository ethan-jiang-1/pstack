<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="双轴评审：固定 diff、标准轴、规格轴、决定">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">双轴评审</text>
  <text x="480" y="62" text-anchor="middle" class="t s">同一段固定 diff，两条独立轴，一个明确决定；不合并成一个分数</text>

  <rect x="330" y="88" width="300" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="480" y="114" text-anchor="middle" class="t bt">固定范围：base → head</text>
  <text x="480" y="134" text-anchor="middle" class="t bs">三点 diff · 提交列表 · 评审包</text>

  <rect x="40" y="178" width="380" height="210" rx="12" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="60" y="206" class="t bt">标准轴</text>
  <text x="60" y="228" class="t bs">是否符合项目约定与可维护性？</text>
  <text x="60" y="256" class="t bs">命名、分层、错误处理</text>
  <text x="60" y="278" class="t bs">不必要的抽象、依赖、配置</text>
  <text x="60" y="300" class="t bs">测试是否在测行为</text>
  <text x="60" y="322" class="t bs">越界改动、顺手重构</text>
  <text x="60" y="350" class="t s">它能说"应该改"，但不能判断"承诺是否兑现"。</text>
  <text x="60" y="372" class="t s">一个完全符合约定的 PR，仍可能实现错了行为。</text>

  <rect x="540" y="178" width="380" height="210" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="560" y="206" class="t bt">规格轴</text>
  <text x="560" y="228" class="t bs">是否忠实实现来源承诺？</text>
  <text x="560" y="256" class="t bs">缺失：承诺了但没实现</text>
  <text x="560" y="278" class="t bs">额外：没承诺却加进来</text>
  <text x="560" y="300" class="t bs">错误：与词卡、行为卡不一致</text>
  <text x="560" y="322" class="t bs">依据：spec、行为地图、证据表</text>
  <text x="560" y="350" class="t s">规格轴的结论不是"代码好不好"，</text>
  <text x="560" y="372" class="t s">而是"这是不是我们要的那一份"。</text>

  <line x1="420" y1="148" x2="280" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="148" x2="680" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="430" width="660" height="80" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="170" y="456" class="t bt">决定：合入 / 请求修改 / 再讨论</text>
  <text x="170" y="478" class="t bs">阻塞：规格缺失、安全、数据风险、越界</text>
  <text x="170" y="498" class="t bs">后续：命名、重复、可选优化；每条有 owner</text>

  <line x1="230" y1="388" x2="340" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="388" x2="620" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="542" text-anchor="middle" class="t s">"总体 8 分"会掩盖冲突：标准满分、规格缺失的 PR 不该合入。</text>
</svg>
