<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="结构约束：从教训到失败案例，再到可靠性阶梯与 CI">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">把教训编码成结构</text>
  <text x="480" y="62" text-anchor="middle" class="t s">从架构往下找最高可行层；每条检查都要在真实历史错误上会失败</text>

  <rect x="40" y="100" width="220" height="90" rx="10" fill="#fee2e2" stroke="#fecaca"/>
  <text x="58" y="128" class="t bt">教训</text>
  <text x="58" y="150" class="t bs">"请务必处理 missing 行"</text>
  <text x="58" y="170" class="t s">说过三次，仍然被忽略</text>

  <rect x="40" y="220" width="220" height="110" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="58" y="248" class="t bt">失败案例</text>
  <text x="58" y="270" class="t bs">输入：勾选 3 行，1 行已删</text>
  <text x="58" y="290" class="t bs">错误：文件 2 行，无标注</text>
  <text x="58" y="310" class="t bs">期望：missing 含该 id</text>
  <text x="58" y="326" class="t s">这是后面所有验证的基准。</text>

  <rect x="320" y="100" width="330" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="340" y="128" class="t bt">可靠性阶梯（从上往下找）</text>
  <text x="340" y="156" class="t bs">1. 架构：错误写法根本不存在</text>
  <text x="340" y="180" class="t bs">2. 类型：非法状态无法表示</text>
  <text x="340" y="204" class="t bs">3. lint / CI：错误无法通过</text>
  <text x="340" y="228" class="t bs">4. 测试：回归被捕获</text>
  <text x="340" y="252" class="t bs">5. 文档：最后才用</text>
  <text x="340" y="286" class="t s">能上一层就上一层；</text>
  <text x="340" y="306" class="t s">跳过文档不会失败，</text>
  <text x="340" y="326" class="t s">所以它是最弱的一层。</text>
  <text x="340" y="358" class="t s">高风险用强约束，</text>
  <text x="340" y="378" class="t s">低风险偏好用轻量检查。</text>

  <rect x="700" y="100" width="220" height="150" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="718" y="128" class="t bt">证明会红</text>
  <text x="718" y="152" class="t bs">把 missing 改回可选</text>
  <text x="718" y="174" class="t bs">→ 类型检查失败</text>
  <text x="718" y="196" class="t bs">旧实现跑回归测试</text>
  <text x="718" y="218" class="t bs">→ 测试失败</text>
  <text x="718" y="240" class="t s">没失败过的检查，只是装饰。</text>

  <rect x="700" y="270" width="220" height="130" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="718" y="298" class="t bt">落地</text>
  <text x="718" y="322" class="t bs">本地与 CI 同一条命令</text>
  <text x="718" y="344" class="t bs">错误信息说明怎么修</text>
  <text x="718" y="366" class="t bs">例外：理由 + 到期日 + 批准人</text>
  <text x="718" y="388" class="t s">规则表暴露没有强制者的规则。</text>

  <line x1="260" y1="145" x2="320" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="275" x2="320" y2="275" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="175" x2="700" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="310" x2="700" y2="335" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="440" width="600" height="54" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="480" y="464" text-anchor="middle" class="t bt">规则表本身就是诊断工具</text>
  <text x="480" y="484" text-anchor="middle" class="t s">每条规则后面空着的那一列，就是下一次摩擦的来源。</text>

  <text x="480" y="530" text-anchor="middle" class="t s">文档不是失败：判断题和取舍适合写文档；它只是不能替代会失败的东西。</text>
</svg>
