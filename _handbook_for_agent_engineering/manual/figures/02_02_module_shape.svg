<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="模块形状卡：接口（public surface）、隐藏实现、不变量与测试表面">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #334155; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">模块形状卡</text>
  <text x="480" y="62" text-anchor="middle" class="t s">接口表达调用者需要知道的事实；测试和调用方从同一 public surface 进入；实现藏在后面</text>

  <rect x="40" y="100" width="170" height="70" rx="10" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="58" y="128" class="t bt">调用方</text>
  <text x="58" y="150" class="t bs">只依赖接口</text>

  <rect x="40" y="220" width="170" height="70" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="58" y="248" class="t bt">测试</text>
  <text x="58" y="270" class="t bs">从同一 public surface 进入</text>

  <line x1="290" y1="96" x2="290" y2="470" stroke="#0f172a" stroke-width="3"/>
  <rect x="160" y="68" width="130" height="26" rx="6" fill="#0f172a"/>
  <text x="225" y="86" text-anchor="middle" class="t bs" fill="#ffffff">public surface</text>

  <rect x="330" y="100" width="590" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="350" y="128" class="t bt">接口</text>
  <text x="350" y="152" class="mono">export(selection: ExportSelection): Promise&lt;ExportResult&gt;</text>
  <text x="350" y="176" class="t bs">意图、结果、不变量、错误、顺序、必要配置</text>

  <rect x="350" y="196" width="550" height="110" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="368" y="222" class="t bt">隐藏的实现</text>
  <text x="368" y="246" class="t bs">订单读取、CSV 转义、缺失检测、文件写出</text>
  <text x="368" y="268" class="t bs">改变这些，不应要求调用方或测试修改</text>
  <text x="368" y="290" class="t s">隐藏的标准不是代码短，而是"换实现时调用方不变"。</text>

  <rect x="350" y="322" width="550" height="120" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="368" y="348" class="t bt">不变量</text>
  <text x="368" y="372" class="t bs">列顺序固定；rows 不含表头</text>
  <text x="368" y="394" class="t bs">missing 只含请求了但不存在的 id，顺序与请求一致</text>
  <text x="368" y="416" class="t bs">空选择不由模块解释成全量</text>

  <line x1="210" y1="135" x2="220" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="255" x2="220" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="135" x2="330" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="255" x2="330" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="490" width="840" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="514" class="t bt">测试表面</text>
  <text x="80" y="534" class="t bs">只调用 export，读 ExportResult；不读私有状态，不加 getSelectedRowsForTest 之类的后门。</text>

  <text x="480" y="478" text-anchor="middle" class="t s">只有一个实现时不要加抽象；等第二个真实变化出现再抽。</text>
</svg>
