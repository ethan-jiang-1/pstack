<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="行为地图：承诺、分类、观察位置与优先级">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11.5px; fill: #475569; }
      .p { font-size: 11px; font-weight: 700; fill: #b45309; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">行为地图</text>
  <text x="480" y="62" text-anchor="middle" class="t s">每条重要承诺要么落到一条可观察行为，要么被明确标成非目标</text>

  <rect x="30" y="100" width="190" height="300" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="48" y="128" class="t bt">spec</text>
  <text x="48" y="154" class="t bs">支持按勾选导出</text>
  <text x="48" y="174" class="t bs">无勾选不导出</text>
  <text x="48" y="194" class="t bs">缺失行不静默丢</text>
  <text x="48" y="214" class="t bs">无权限拒绝</text>
  <text x="48" y="234" class="t bs">不做 Excel</text>
  <text x="48" y="270" class="t s">逐条编号，</text>
  <text x="48" y="290" class="t s">不按模块分。</text>

  <rect x="260" y="100" width="300" height="60" rx="8" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="278" y="124" class="t bt">用户结果</text>
  <text x="278" y="146" class="t bs">勾选 3 行 → 文件 3 行</text>

  <rect x="260" y="170" width="300" height="60" rx="8" fill="#fee2e2" stroke="#fecaca"/>
  <text x="278" y="194" class="t bt">禁止行为</text>
  <text x="278" y="216" class="t bs">不能写入未勾选行；不能导出他人订单</text>

  <rect x="260" y="240" width="300" height="60" rx="8" fill="#fef3c7" stroke="#fde68a"/>
  <text x="278" y="264" class="t bt">失败出口</text>
  <text x="278" y="286" class="t bs">无勾选禁用；缺失行标注；无权限 403</text>

  <rect x="260" y="310" width="300" height="60" rx="8" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="278" y="334" class="t bt">权限与责任</text>
  <text x="278" y="356" class="t bs">谁能触发；谁批准；失败谁接手</text>

  <rect x="260" y="380" width="300" height="50" rx="8" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="278" y="404" class="t bt">非目标</text>
  <text x="278" y="422" class="t s">这次明确不做的事，写成可检查边界</text>

  <rect x="620" y="100" width="310" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="640" y="128" class="t bt">每条行为带三样东西</text>
  <text x="640" y="156" class="t bs">Given / When / Then</text>
  <text x="640" y="180" class="t bs">观察位置：从哪里看到结果</text>
  <text x="640" y="204" class="t bs">优先级：必须 / 应该 / 可以</text>
  <text x="640" y="234" class="t p">例：缺失行不静默丢</text>
  <text x="640" y="256" class="t bs">Given：勾选 3 行，1 行已删除</text>
  <text x="640" y="276" class="t bs">Then：文件 2 行，标注 1 行缺失</text>
  <text x="640" y="296" class="t bs">观察：文件 + 返回值</text>
  <text x="640" y="316" class="t bs">优先级：必须</text>
  <text x="640" y="350" class="t s">没有观察位置的承诺</text>
  <text x="640" y="370" class="t s">要么补观察，要么移出本期。</text>
  <text x="640" y="402" class="t s">优先级决定验证投入，</text>
  <text x="640" y="422" class="t s">不决定是否记录。</text>

  <line x1="220" y1="200" x2="260" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="220" x2="260" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="240" x2="260" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="260" x2="260" y2="340" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="280" x2="260" y2="405" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="270" x2="620" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="480" width="600" height="50" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="480" y="504" text-anchor="middle" class="t bt">如果地图里全是用户结果，没有失败、权限和禁止行为，大概率漏了</text>
  <text x="480" y="524" text-anchor="middle" class="t s">五类逐类问一遍，比按功能模块逐块写更容易暴露缺口。</text>
</svg>
