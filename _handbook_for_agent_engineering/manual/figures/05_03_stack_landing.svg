<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="栈落地：冻结顺序、独立 verdict、连续段、patch-id 与停止点">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .bt { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 11px; fill: #475569; }
      .v { font-size: 11px; font-weight: 700; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="t h">栈落地</text>
  <text x="480" y="62" text-anchor="middle" class="t s">只落地从最低未合并 PR 开始的连续已验证段；第一个没有 PASS 或 PASS+NOTES 的 PR 就是停止点</text>

  <rect x="60" y="96" width="500" height="44" rx="8" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="80" y="118" class="t bt">P6 顶层</text>
  <text x="430" y="120" class="t v" fill="#15803d">PASS</text>
  <text x="80" y="135" class="t s">在停止点之上：即使 PASS 也不能先合</text>

  <rect x="60" y="152" width="500" height="44" rx="8" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="80" y="180" class="t bt">P5</text>
  <text x="430" y="180" class="t v" fill="#15803d">PASS</text>

  <rect x="60" y="208" width="500" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="80" y="236" class="t bt">P4 停止点</text>
  <text x="430" y="236" class="t v" fill="#b91c1c">无 verdict</text>
  <text x="80" y="252" class="t s">第一个没有 PASS 或 PASS+NOTES 的 PR；它上面的都等着</text>

  <rect x="60" y="272" width="500" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="300" class="t bt">P3</text>
  <text x="430" y="300" class="t v" fill="#15803d">PASS+NOTES</text>

  <rect x="60" y="328" width="500" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="356" class="t bt">P2</text>
  <text x="430" y="356" class="t v" fill="#15803d">PASS</text>

  <rect x="60" y="384" width="500" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="412" class="t bt">P1 底层</text>
  <text x="430" y="412" class="t v" fill="#15803d">PASS</text>

  <text x="60" y="456" class="t s">绿色连续段：P1 → P2 → P3。自底向上，一次合一个。</text>

  <rect x="610" y="96" width="300" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="630" y="124" class="t bt">落地前检查</text>
  <text x="630" y="150" class="t bs">冻结从底到顶的 PR 列表与 SHA</text>
  <text x="630" y="174" class="t bs">每个 PR 有非作者 verdict</text>
  <text x="630" y="198" class="t bs">verdict 覆盖当前 head</text>
  <text x="630" y="222" class="t bs">用 patch-id 检查 rebase 后是否仍覆盖</text>
  <text x="630" y="246" class="t bs">确认合并后的 base 与状态</text>
  <text x="630" y="276" class="t s">合并命令报告成功 ≠ 真的合了；</text>
  <text x="630" y="296" class="t s">合并队列可能只是排队。</text>

  <rect x="610" y="356" width="300" height="110" rx="12" fill="#fef3c7" stroke="#fde68a"/>
  <text x="630" y="384" class="t bt">落地过程中不动栈</text>
  <text x="630" y="408" class="t bs">不 rebase、不 retarget、不 force-push</text>
  <text x="630" y="430" class="t bs">只做"把下一个 PR 移到主干"</text>
  <text x="630" y="452" class="t s">第二个写者会合入未经当前 head 验证的代码。</text>

  <text x="480" y="510" text-anchor="middle" class="t s">绿 CI 和 bot approval 不是 verdict；作者自证不是独立验证。</text>
  <text x="480" y="534" text-anchor="middle" class="t s">要继续往上合，就为停止点及其上面的 PR 取得新的 verdict。</text>
</svg>
